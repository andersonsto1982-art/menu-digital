<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Administrador - Cardápio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-4 text-gray-800">

  <div class="max-w-md mx-auto space-y-6">
    <div class="flex justify-between items-center border-b pb-3">
      <h1 class="text-xl font-bold">Gerenciar Cardápio</h1>
      <a href="index.html" class="text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded-lg text-gray-700">
        <i class="fa-solid fa-arrow-left"></i> Ver Menu
      </a>
    </div>

    <!-- Form Cadastrar / Editar -->
    <div class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
      <h2 class="font-bold text-sm text-gray-700" id="form-titulo">Adicionar Novo Lanche</h2>
      <input type="hidden" id="prod-id">
      <input type="text" id="prod-nome" placeholder="Nome do Lanche" class="w-full border p-2 rounded text-sm outline-none focus:border-red-600">
      <textarea id="prod-desc" placeholder="Descrição/Ingredientes" class="w-full border p-2 rounded text-sm outline-none focus:border-red-600 h-20"></textarea>
      <input type="number" step="0.01" id="prod-preco" placeholder="Valor (ex: 22.50)" class="w-full border p-2 rounded text-sm outline-none focus:border-red-600">
      
      <div class="flex gap-2">
        <button onclick="salvarProduto()" class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-lg text-sm">
          Salvar Produto
        </button>
        <button onclick="limparFormulario()" class="bg-gray-200 hover:bg-gray-300 text-gray-600 font-bold py-2 px-3 rounded-lg text-sm">
          Cancelar
        </button>
      </div>
    </div>

    <!-- Lista de Itens Cadastrados -->
    <div class="space-y-3">
      <h2 class="font-bold text-sm text-gray-700">Itens Atuais</h2>
      <div id="admin-lista-produtos" class="space-y-2">
        <!-- Renderizado via JS -->
      </div>
    </div>
  </div>

  <script>
    const produtosPadrao = [
      { id: 1, nome: "X-Burguer Especial", desc: "Pão artesanal, hambúrguer 150g, queijo prato e molho da casa.", preco: 22.00 },
      { id: 2, nome: "X-Salada Tradicional", desc: "Pão, hambúrguer 120g, queijo, alface, tomate e maionese.", preco: 18.00 },
      { id: 3, nome: "Batata Frita G", desc: "Porção de 400g de batata crocante com cheddar e bacon.", preco: 25.00 }
    ];

    function getProdutos() {
      return JSON.parse(localStorage.getItem('cardapio_lanches')) || produtosPadrao;
    }

    function salvarProdutosStorage(produtos) {
      localStorage.setItem('cardapio_lanches', JSON.stringify(produtos));
      renderizarAdmin();
    }

    function renderizarAdmin() {
      const container = document.getElementById('admin-lista-produtos');
      const produtos = getProdutos();
      container.innerHTML = '';

      produtos.forEach(p => {
        container.innerHTML += `
          <div class="bg-white p-3 rounded-lg border flex justify-between items-center">
            <div>
              <p class="font-bold text-sm">${p.nome}</p>
              <p class="text-xs text-gray-500">R$ ${p.preco.toFixed(2)}</p>
            </div>
            <div class="flex gap-2">
              <button onclick="prepararEdicao(${p.id})" class="text-blue-600 hover:text-blue-800 p-1">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="excluirProduto(${p.id})" class="text-red-600 hover:text-red-800 p-1">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      });
    }

    function salvarProduto() {
      const id = document.getElementById('prod-id').value;
      const nome = document.getElementById('prod-nome').value.trim();
      const desc = document.getElementById('prod-desc').value.trim();
      const preco = parseFloat(document.getElementById('prod-preco').value);

      if (!nome || isNaN(preco)) return alert("Preencha ao menos o Nome e o Valor corretamente.");

      let produtos = getProdutos();

      if (id) {
        // Editar existente
        produtos = produtos.map(p => p.id == id ? { id: Number(id), nome, desc, preco } : p);
      } else {
        // Novo cadastro
        const novoId = Date.now();
        produtos.push({ id: novoId, nome, desc, preco });
      }

      salvarProdutosStorage(produtos);
      limparFormulario();
    }

    function prepararEdicao(id) {
      const produtos = getProdutos();
      const p = produtos.find(item => item.id === id);
      if (!p) return;

      document.getElementById('prod-id').value = p.id;
      document.getElementById('prod-nome').value = p.nome;
      document.getElementById('prod-desc').value = p.desc;
      document.getElementById('prod-preco').value = p.preco;
      document.getElementById('form-titulo').innerText = "Editar Lanche";
    }

    function excluirProduto(id) {
      if (confirm("Tem certeza que deseja remover este item do cardápio?")) {
        let produtos = getProdutos();
        produtos = produtos.filter(p => p.id !== id);
        salvarProdutosStorage(produtos);
      }
    }

    function limparFormulario() {
      document.getElementById('prod-id').value = '';
      document.getElementById('prod-nome').value = '';
      document.getElementById('prod-desc').value = '';
      document.getElementById('prod-preco').value = '';
      document.getElementById('form-titulo').innerText = "Adicionar Novo Lanche";
    }

    renderizarAdmin();
  </script>
</body>
</html>
