<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Digital - Lanchonete</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 pb-24 text-gray-800">

  <!-- Cabeçalho -->
  <header class="bg-red-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">🍔 Burguer & Cia</h1>
      <p class="text-xs text-red-100">O melhor lanche da cidade</p>
    </div>
    <a href="admin.html" class="text-xs bg-red-700 hover:bg-red-800 px-3 py-1.5 rounded-lg text-white transition">
      <i class="fa-solid fa-lock"></i> Admin
    </a>
  </header>

  <!-- Lista de Produtos -->
  <main class="max-w-md mx-auto p-4 space-y-4" id="lista-produtos">
    <!-- Os produtos serão renderizados via JavaScript -->
  </main>

  <!-- Barra Fixa da Sacolinha (Bottom Bar) -->
  <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 shadow-lg flex justify-between items-center max-w-md mx-auto">
    <div>
      <p class="text-xs text-gray-500">Total (sem frete):</p>
      <p class="text-lg font-bold text-red-600" id="total-barra">R$ 0,00</p>
    </div>
    <button onclick="abrirSacolinha()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-xl flex items-center gap-2 shadow-md">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Ver Sacolinha</span>
      <span id="qtd-sacolinha" class="bg-white text-red-600 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
    </button>
  </div>

  <!-- Modal da Sacolinha -->
  <div id="modal-sacolinha" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col justify-between p-4 overflow-y-auto">
      <div>
        <div class="flex justify-between items-center border-b pb-3 mb-4">
          <h2 class="text-lg font-bold flex items-center gap-2">
            <i class="fa-solid fa-bag-shopping text-red-600"></i> Sua Sacolinha
          </h2>
          <button onclick="fecharSacolinha()" class="text-gray-500 hover:text-black">
            <i class="fa-solid fa-xmark text-xl"></i>
          </button>
        </div>

        <!-- Itens Adicionados -->
        <div id="itens-sacolinha" class="space-y-3 mb-4">
          <!-- Renderizado via JS -->
        </div>

        <!-- Opção de Entrega / Retirada -->
        <div class="bg-gray-50 p-3 rounded-lg border mb-4">
          <p class="font-semibold text-sm mb-2">Forma de Recebimento:</p>
          <div class="flex gap-4">
            <label class="flex items-center text-sm gap-2 cursor-pointer">
              <input type="radio" name="tipoEntrega" value="entrega" checked onchange="atualizarTotalSacolinha()">
              Entrega (+ R$ 5,00)
            </label>
            <label class="flex items-center text-sm gap-2 cursor-pointer">
              <input type="radio" name="tipoEntrega" value="retirada" onchange="atualizarTotalSacolinha()">
              Retirar no Local
            </label>
          </div>
        </div>

        <!-- Dados do Cliente -->
        <div class="space-y-2">
          <input type="text" id="nome-cliente" placeholder="Seu Nome *" class="w-full border p-2 rounded text-sm outline-none focus:border-red-600">
          <input type="text" id="endereco-cliente" placeholder="Endereço Completo (se entrega)" class="w-full border p-2 rounded text-sm outline-none focus:border-red-600">
          <select id="pagamento-cliente" class="w-full border p-2 rounded text-sm outline-none focus:border-red-600">
            <option value="Pix">Forma de Pagamento: Pix</option>
            <option value="Cartão de Crédito/Débito">Cartão de Crédito/Débito</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </div>
      </div>

      <!-- Resumo e Envio -->
      <div class="border-t pt-3 mt-4">
        <div class="flex justify-between font-bold text-lg mb-3">
          <span>Total Geral:</span>
          <span id="total-sacolinha-modal" class="text-red-600">R$ 0,00</span>
        </div>
        <button onclick="finalizarWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg">
          <i class="fa-brands fa-whatsapp text-xl"></i> Finalizar Pedido no WhatsApp
        </button>
      </div>
    </div>
  </div>

<script src="JS/script.js"></script>
</body>
</html>
